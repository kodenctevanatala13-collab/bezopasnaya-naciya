    <text x="95" y="135" text-anchor="middle" fill="#0F233E" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Аптечка + Синий турникет</text>
    <text x="95" y="152" text-anchor="middle" fill="#047857" font-family="Arial, sans-serif" font-size="10">Заводской стандарт РК</text>
    <text x="95" y="167" text-anchor="middle" fill="#64748B" font-family="Arial, sans-serif" font-size="10">(без лекарственных средств)</text>
