    <rect x="35" y="28" width="75" height="95" rx="6" fill="#F59E0B" transform="rotate(-6 70 70)"/>
    <rect x="48" y="28" width="75" height="95" rx="6" fill="#0284C7" stroke="#FFFFFF" stroke-width="2"/>
    <text x="85" y="65" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="13" font-weight="bold">112 РК</text>
    <text x="85" y="85" text-anchor="middle" fill="#E0F2FE" font-family="Arial, sans-serif" font-size="10">КОМИКС-ТЕТРАДЬ</text>
