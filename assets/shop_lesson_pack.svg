    <path d="M67 30 L85 22 M45 34 L30 55" stroke="#1E293B" stroke-width="4" stroke-linecap="round"/>
    <text x="60" y="158" text-anchor="middle" fill="#0F233E" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Макет огнетушителя</text>
    <text x="60" y="173" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="10">учебный разрезной</text>
  </g>
