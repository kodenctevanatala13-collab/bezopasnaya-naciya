    <path d="M30 50 C15 50, 15 30, 45 25 M130 50 C145 50, 145 30, 115 25" stroke="#94A3B8" stroke-width="4" fill="none"/>
    <text x="80" y="98" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="13" font-weight="bold">4× VR-шлема Pico 4</text>
    <text x="80" y="113" text-anchor="middle" fill="#7DD3FC" font-family="Arial, sans-serif" font-size="10">ПО ЧС (ҚАЗ / РУС)</text>
