      <stop offset="0%" stop-color="#0F233E"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
  </defs>
  <rect width="640" height="380" rx="18" fill="url(#bg1)"/>
  <rect x="20" y="20" width="600" height="340" rx="14" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2" stroke-dasharray="8,6"/>
  <!-- VR Headsets Pico 4 -->
  <g transform="translate(45, 55)">
