  <text x="320" y="295" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="14" font-weight="bold">ОРИЕНТИРОВОЧНАЯ ЦЕНА: ~6 000 000 ₸</text>
